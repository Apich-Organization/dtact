name: Benchmark baseline

# Saves the Criterion baseline that `benchmark.yml` restores on pull requests.
#
# This job used to live in the GitHub Pages deploy workflow. The site is no
# longer built from this repository, but the baseline still has to be produced
# on main, or PR benchmarks have nothing to compare against.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "benches/**"
      - "dtact-macros/**"
      - "dtact-util/**"
      - ".github/workflows/bench-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-baseline
  cancel-in-progress: true

jobs:
  baseline:
    name: Record baseline on main
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache Cargo registry + build
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2

      - name: Run Criterion benchmarks
        # Saves under the named baseline "main" (rather than Criterion's
        # default unnamed base/new cycle, which only ever compares a run
        # against whatever ran immediately before it *in the same
        # checkout* — meaningless in CI, where every job starts fresh).
        # `benchmark.yml`'s PR jobs restore the cache saved below and
        # compare their own run against this named baseline.
        run: cargo bench -- --save-baseline main

      - name: Save Criterion baseline for PR comparisons
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/criterion
          key: criterion-baseline-main-${{ github.sha }}

      # Kept so the HTML report can be downloaded from the run. It is no longer
      # published anywhere; if a public report is wanted again, it needs a host.
      - name: Upload criterion report artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: criterion-report
          path: target/criterion
          retention-days: 7
